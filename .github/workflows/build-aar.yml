name: Build AAR

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug and release AARs
        shell: bash
        run: ./gradlew assembleDebug assembleRelease --console=plain 2>&1 | tee build.log

      - name: Show Kotlin errors
        if: failure()
        run: grep -E "^e: " build.log | head -40

      - name: Upload AARs
        uses: actions/upload-artifact@v4
        with:
          name: GodotAdMob-aar
          path: plugin/build/outputs/aar/*.aar
          if-no-files-found: error
